# ============================================================
# HTTP
# ============================================================

server {
    listen 80;
    server_name laqq.com.ar www.laqq.com.ar laqq.com www.laqq.com;

    # Let's Encrypt / Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Todo el tráfico HTTP → HTTPS
    location / {
        return 301 https://laqq.com.ar$request_uri;
    }
}


# ============================================================
# HTTPS
# ============================================================

server {
    listen 443 ssl;
    server_name laqq.com.ar www.laqq.com.ar laqq.com www.laqq.com;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # ========================================================
    # SSL / Let's Encrypt
    # ========================================================

    ssl_certificate /etc/letsencrypt/live/laqq.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laqq.com.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;


    # ========================================================
    # API → Django
    # ========================================================

    location ^~ /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nunca cachear respuestas de la API (evita que errores/
        # respuestas viejas queden servidas por intermediarios).
        add_header Cache-Control "no-store";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ========================================================
    # Static Django
    # ========================================================

    location ^~ /static/ {
        alias /var/www/static/;

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
    }

    # ========================================================
    # Media
    # ========================================================

    location ^~ /media/ {
        alias /var/www/media/;

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
    }

    # ========================================================
    # robots.txt
    # ========================================================

    location = /robots.txt {
        add_header Cache-Control "no-store";

    }

    # ========================================================
    # sitemap.xml
    # ========================================================

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300";

    }

    # ========================================================
    # Frontend assets
    # ========================================================

    location ~* \.(?:js|css|mjs|map|png|jpe?g|gif|webp|svg|ico|pdf|xlsx|woff2?|ttf|eot|webmanifest)$ {
        try_files $uri =404;

        expires 7d;

        add_header Cache-Control "public, max-age=604800";

    }

    # ========================================================
    # index.html (cáscara SPA): nunca cachear
    # ========================================================
    # Aplica también al fallback interno de la SPA (try_files -> /index.html).
    # Con no-cache + must-revalidate el navegador revalida en cada visita,
    # así los usuarios con la versión vieja se autocorrigen sin limpiar caché.

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ========================================================
    # React Router / SPA
    # ========================================================

    location / {
        try_files $uri /index.html;
    }
}