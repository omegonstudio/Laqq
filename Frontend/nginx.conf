server {
    listen 80;
    server_name laqq.com.ar www.laqq.com.ar;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Let's Encrypt / Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # PRE-LAUNCH
    # Cambiar a: set $x_robots_tag "index, follow";
    # (o eliminar add_header X-Robots-Tag; index,follow es el default)
    # Antes del GO LIVE.
    #
    # IMPORTANTE: en nginx, cualquier add_header dentro de un location
    # anula la herencia del nivel server. Por eso se repite X-Robots-Tag
    # en locations que ya definen otros headers.
    set $x_robots_tag "noindex, nofollow, noarchive, nosnippet, noimageindex";
    add_header X-Robots-Tag $x_robots_tag always;

    # API → Django
    location ^~ /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static de Django
    location ^~ /static/ {
        alias /var/www/static/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # Media
    location ^~ /media/ {
        alias /var/www/media/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # robots.txt
    location = /robots.txt {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # sitemap.xml
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # Assets del frontend
    location ~* \.(?:js|css|mjs|map|png|jpe?g|gif|webp|svg|ico|pdf|xlsx|woff2?|ttf|eot|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # React Router / SPA
    location / {
        try_files $uri /index.html;
    }
}