# ============================================================
# Log format con Host visible (para diagnosticar ALLOWED_HOSTS)
# ============================================================
# host       = dominio que pidió el cliente (server_name)
# http_host  = Valor bruto del header Host
# upstream   = resultado real del backend (400 = DisallowedHost)
# Se usa en el server HTTPS con access_log /dev/stdout.
log_format main_ext '$remote_addr - [$time_local] "$request" $status '
                    'host="$host" http_host="$http_host" upstream="$upstream_addr" '
                    '"$http_referer" "$http_user_agent"';


# ============================================================
# HTTP
# ============================================================

server {
    listen 80;
    server_name laqq.com.ar www.laqq.com.ar laqq.com www.laqq.com;

    # Let's Encrypt / Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Todo el tráfico HTTP → HTTPS
    location / {
        return 301 https://laqq.com.ar$request_uri;
    }
}


# ============================================================
# HTTPS — hosts alternativos (solo redirect, sin SPA/API)
# ============================================================

server {
    listen 443 ssl;
    server_name www.laqq.com.ar laqq.com www.laqq.com;

    ssl_certificate /etc/letsencrypt/live/laqq.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laqq.com.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://laqq.com.ar$request_uri;
}


# ============================================================
# HTTPS — host canónico
# ============================================================

server {
    listen 443 ssl;
    server_name laqq.com.ar;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Logs de accesos con Host a /dev/stdout (capturados por docker logs)
    access_log /dev/stdout main_ext;

    # ========================================================
    # SSL / Let's Encrypt
    # ========================================================

    ssl_certificate /etc/letsencrypt/live/laqq.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laqq.com.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;


    # ========================================================
    # URLs del sitio anterior (Theia / ASP.NET)
    # Exact match (=) tiene prioridad sobre regex y sobre location /
    # ========================================================

    # Home
    location = /Home.aspx {
        return 301 /;
    }

    location = /Default.aspx {
        return 301 /;
    }

    # Empresa / representaciones
    location = /Empresa.aspx {
        return 301 /company;
    }

    location = /Representaciones.aspx {
        return 301 /company;
    }

    # Alias legacy → sección Representaciones dentro de Empresa
    location = /representantes {
        return 301 https://laqq.com.ar/company\#representaciones;
    }

    # Contacto
    location = /Contactenos.aspx {
        return 301 /contact;
    }

    # Buscador
    location = /Buscador.aspx {
        return 301 /products;
    }

    # Certificados
    location = /Certificados.aspx {
        return 301 /certificates;
    }

    # Servicio técnico
    location = /ServicioTecnico.aspx {
        return 301 /support;
    }

    # Sin equivalente: eliminación explícita
    location = /Promociones.aspx {
        return 410;
    }

    location ~* ^/WHEATON/?$ {
        return 410;
    }

    location = /App_Themes {
        return 410;
    }

    location ^~ /App_Themes/ {
        return 410;
    }

    location = /productos {
        return 410;
    }

    location ^~ /productos/ {
        return 410;
    }

    # Cualquier otro .aspx del sitio anterior
    location ~* \.aspx$ {
        return 410;
    }


    # ========================================================
    # API → Django
    # ========================================================

    location ^~ /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nunca cachear respuestas de la API (evita que errores/
        # respuestas viejas queden servidas por intermediarios).
        add_header Cache-Control "no-store";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ========================================================
    # Static Django
    # ========================================================

    location ^~ /static/ {
        alias /var/www/static/;

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
    }

    # ========================================================
    # Media
    # ========================================================

    location ^~ /media/ {
        alias /var/www/media/;

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
    }

    # ========================================================
    # robots.txt
    # ========================================================

    location = /robots.txt {
        add_header Cache-Control "no-store";

    }

    # ========================================================
    # sitemap.xml
    # ========================================================

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300";

    }

    # ========================================================
    # Web App Manifest
    # ========================================================

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800";
    }

    # ========================================================
    # Frontend assets
    # ========================================================

    location ~* \.(?:js|css|mjs|map|png|jpe?g|gif|webp|svg|ico|pdf|xlsx|woff2?|ttf|eot|webmanifest)$ {
        try_files $uri =404;

        expires 7d;

        add_header Cache-Control "public, max-age=604800";

    }

    # ========================================================
    # index.html (cáscara SPA): nunca cachear
    # ========================================================
    # Aplica también al fallback interno de la SPA (try_files -> /index.html).
    # Con no-cache + must-revalidate el navegador revalida en cada visita,
    # así los usuarios con la versión vieja se autocorrigen sin limpiar caché.

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ========================================================
    # React Router / SPA
    # ========================================================

    location / {
        try_files $uri /index.html;
    }
}
