# ============================================================
# HTTP
# ============================================================

server {
    listen 80;
    server_name laqq.com.ar www.laqq.com.ar;

    # Let's Encrypt / Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Todo el tráfico HTTP → HTTPS
    location / {
        return 301 https://laqq.com.ar$request_uri;
    }
}


# ============================================================
# HTTPS
# ============================================================

server {
    listen 443 ssl;
    server_name laqq.com.ar www.laqq.com.ar;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # ========================================================
    # SSL / Let's Encrypt
    # ========================================================

    ssl_certificate /etc/letsencrypt/live/laqq.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laqq.com.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ========================================================
    # PRE-LAUNCH
    # ========================================================

    set $x_robots_tag "noindex, nofollow, noarchive, nosnippet, noimageindex";

    add_header X-Robots-Tag $x_robots_tag always;

    # ========================================================
    # API → Django
    # ========================================================

    location ^~ /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================================
    # Static Django
    # ========================================================

    location ^~ /static/ {
        alias /var/www/static/;

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # ========================================================
    # Media
    # ========================================================

    location ^~ /media/ {
        alias /var/www/media/;

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # ========================================================
    # robots.txt
    # ========================================================

    location = /robots.txt {
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # ========================================================
    # sitemap.xml
    # ========================================================

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # ========================================================
    # Frontend assets
    # ========================================================

    location ~* \.(?:js|css|mjs|map|png|jpe?g|gif|webp|svg|ico|pdf|xlsx|woff2?|ttf|eot|webmanifest)$ {
        try_files $uri =404;

        expires 7d;

        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # ========================================================
    # React Router / SPA
    # ========================================================

    location / {
        try_files $uri /index.html;
    }
}