# ============================================================
# Log format con Host visible (para diagnosticar ALLOWED_HOSTS)
# ============================================================
# host       = dominio que pidió el cliente (server_name)
# http_host  = Valor bruto del header Host
# upstream   = resultado real del backend (400 = DisallowedHost)
# Se usa en el server HTTPS con access_log /dev/stdout.
log_format main_ext '$remote_addr - [$time_local] "$request" $status '
                    'host="$host" http_host="$http_host" upstream="$upstream_addr" '
                    '"$http_referer" "$http_user_agent"';


# ============================================================
# HTTP
# ============================================================

server {
    listen 80;
    server_name laqq.com.ar www.laqq.com.ar laqq.com www.laqq.com;

    # Let's Encrypt / Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Todo el tráfico HTTP → HTTPS
    location / {
        return 301 https://laqq.com.ar$request_uri;
    }
}


# ============================================================
# HTTPS — hosts alternativos (solo redirect, sin SPA/API)
# ============================================================

server {
    listen 443 ssl;
    server_name www.laqq.com.ar laqq.com www.laqq.com;

    ssl_certificate /etc/letsencrypt/live/laqq.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laqq.com.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://laqq.com.ar$request_uri;
}


# ============================================================
# HTTPS — host canónico
# ============================================================

server {
    listen 443 ssl;
    server_name laqq.com.ar;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Logs de accesos con Host a /dev/stdout (capturados por docker logs)
    access_log /dev/stdout main_ext;

    # ========================================================
    # SSL / Let's Encrypt
    # ========================================================

    ssl_certificate /etc/letsencrypt/live/laqq.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laqq.com.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;


    # ========================================================
    # URLs del sitio anterior (Theia / ASP.NET)
    # Exact match (=) tiene prioridad sobre regex y sobre location /
    # ========================================================

    # Home
    location = /Home.aspx {
        return 301 /;
    }

    location = /Default.aspx {
        return 301 /;
    }

    # Empresa / representaciones
    location = /Empresa.aspx {
        return 301 /company;
    }

    location = /Representaciones.aspx {
        return 301 /company;
    }

CORRECCIÓN IMPORTANTE SOBRE PR SEO

La URL real de la sección de Representaciones NO es una página independiente.

La sección vive dentro de Company:

https://laqq.com.ar/company#representaciones

Por lo tanto, NO debemos crear una ruta React `/representantes`.

Tampoco debemos crear una URL SEO independiente para Representaciones.

La arquitectura correcta debe ser:

/
→ Home

/company
→ página Empresa

/company#representaciones
→ sección Representaciones dentro de Empresa

/representantes
→ URL legacy/alias que debe redirigir hacia:
https://laqq.com.ar/company#representaciones

==================================================
REDIRECT
==================================================

Implementar:

/representantes
        ↓ 301
/company#representaciones

El Location debe ser:

https://laqq.com.ar/company#representaciones

IMPORTANTE:

El fragmento `#representaciones` no es enviado al servidor y no forma parte de la URL que procesa Nginx.

Nginx debe recibir:

/representantes

y devolver:

HTTP/1.1 301
Location: https://laqq.com.ar/company#representaciones

El navegador deberá terminar en:

https://laqq.com.ar/company#representaciones

==================================================
SEO
==================================================

NO crear canonical:

https://laqq.com.ar/representantes

NO agregar `/representantes` al sitemap.

NO crear metadata SEO propia para `/representantes`.

La URL canónica de la página sigue siendo:

https://laqq.com.ar/company

El fragmento:

#representaciones

identifica una sección dentro de esa página y no debe tratarse como una URL indexable independiente.

==================================================
ENLACES INTERNOS
==================================================

Buscar referencias internas a:

/representantes

Si existen enlaces que conceptualmente llevan a la sección Representaciones, cambiarlos para apuntar directamente a:

/company#representaciones

Esto evita generar navegación innecesaria mediante `/representantes`.

IMPORTANTE:

No cambiar enlaces que tengan otro propósito legítimo.

Revisar especialmente:

- Header
- navegación
- Footer
- CompanySection
- cualquier CTA relacionado con Representaciones

==================================================
SEOHEAD / 404
==================================================

Mantener la corrección propuesta anteriormente:

Las rutas desconocidas que caen en NotFound no deberían quedar con:

robots = index, follow
canonical = /

Si `SeoHead` permite hacerlo de forma simple y segura:

404/no-public route:
robots = noindex, follow

Pero:

/
→ index, follow
→ canonical /

/company
→ index, follow
→ canonical /company

NO aplicar noindex a Company.

