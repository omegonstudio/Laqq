server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # PRE-LAUNCH
    # Cambiar a: set $x_robots_tag "index, follow";
    # (o eliminar add_header X-Robots-Tag; index,follow es el default)
    # Antes del GO LIVE.
    #
    # IMPORTANTE: en nginx, cualquier add_header dentro de un location
    # anula la herencia del nivel server. Por eso se repite X-Robots-Tag
    # en locations que ya definen otros headers.
    set $x_robots_tag "noindex, nofollow, noarchive, nosnippet, noimageindex";
    add_header X-Robots-Tag $x_robots_tag always;

    # ^~ evita que el regex de assets capture estas rutas.
    location ^~ /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Hereda X-Robots-Tag del server (sin add_header propio).
    }

    location ^~ /static/ {
        alias /var/www/static/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # PRE-LAUNCH — repetir X-Robots-Tag (rompe herencia por Cache-Control).
        add_header X-Robots-Tag $x_robots_tag always;
    }

    location ^~ /media/ {
        alias /var/www/media/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # PRE-LAUNCH — repetir X-Robots-Tag (rompe herencia por Cache-Control).
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # robots.txt y sitemap: sin cache agresivo (cambios GO LIVE deben verse al toque).
    location = /robots.txt {
        add_header Cache-Control "no-store";
        # PRE-LAUNCH
        add_header X-Robots-Tag $x_robots_tag always;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300";
        # PRE-LAUNCH
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # Assets del frontend en root: 404 real si no existen (evita soft-404 HTML).
    # No aplica a /api|, /media|, /static| gracias a ^~ arriba.
    location ~* \.(?:js|css|mjs|map|png|jpe?g|gif|webp|svg|ico|pdf|xlsx|woff2?|ttf|eot|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # PRE-LAUNCH
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # Single Page Application (React Router)
    # Soft-404 intencional para rutas client-side sin archivo físico:
    # nginx sirve index.html con 200; NotFound.tsx maneja la UX.
    # No reemplazar por =404: rompería el enrutado de React.
    location / {
        try_files $uri /index.html;
    }
}
