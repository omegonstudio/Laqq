# ============================================================
# Nginx DEV — HTTP only (laqq.omegon.com.ar)
# Sin SSL, sin Let's Encrypt, sin redirects a PROD/HTTPS.
# ============================================================

log_format main_ext '$remote_addr - [$time_local] "$request" $status '
                    'host="$host" http_host="$http_host" upstream="$upstream_addr" '
                    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name laqq.omegon.com.ar;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    access_log /dev/stdout main_ext;

    # ========================================================
    # URLs del sitio anterior (Theia / ASP.NET)
    # ========================================================

    location = /Home.aspx {
        return 301 /;
    }

    location = /Default.aspx {
        return 301 /;
    }

    location = /Empresa.aspx {
        return 301 /company;
    }

    location = /Representaciones.aspx {
        return 301 /company;
    }

    location = /Contactenos.aspx {
        return 301 /contact;
    }

    location = /Buscador.aspx {
        return 301 /products;
    }

    location = /Certificados.aspx {
        return 301 /certificates;
    }

    location = /ServicioTecnico.aspx {
        return 301 /support;
    }

    location = /Promociones.aspx {
        return 410;
    }

    location ~* ^/WHEATON/?$ {
        return 410;
    }

    location = /App_Themes {
        return 410;
    }

    location ^~ /App_Themes/ {
        return 410;
    }

    location = /productos {
        return 410;
    }

    location ^~ /productos/ {
        return 410;
    }

    location ~* \.aspx$ {
        return 410;
    }

    # ========================================================
    # API → Django
    # ========================================================

    location ^~ /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ========================================================
    # Static Django
    # ========================================================

    location ^~ /static/ {
        alias /var/www/static/;

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
    }

    # ========================================================
    # Media
    # ========================================================

    location ^~ /media/ {
        alias /var/www/media/;

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
    }

    # ========================================================
    # robots.txt / sitemap / manifest
    # ========================================================

    location = /robots.txt {
        add_header Cache-Control "no-store";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800";
    }

    # ========================================================
    # Frontend assets
    # ========================================================

    location ~* \.(?:js|css|mjs|map|png|jpe?g|gif|webp|svg|ico|pdf|xlsx|woff2?|ttf|eot|webmanifest)$ {
        try_files $uri =404;

        expires 7d;

        add_header Cache-Control "public, max-age=604800";
    }

    # ========================================================
    # index.html (cáscara SPA): nunca cachear
    # ========================================================

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ========================================================
    # React Router / SPA
    # ========================================================

    location / {
        try_files $uri /index.html;
    }
}
