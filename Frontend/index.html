<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1f2a" />

    <title>LaQQ | La Química Quirúrgica - Equipo y Material de Laboratorio</title>
    <meta
      name="description"
      content="Proveedor especializado en equipo de laboratorio, material de consumo y servicios técnicos para la industria científica."
    />
    <meta name="author" content="La Química Quirúrgica" />

    <!-- Canonical (HTTPS listo para producción) -->
    <link rel="canonical" href="https://laqq.com.ar/" />
    <link rel="describedby" href="https://laqq.com.ar/llms.txt" />

    <!-- Fuente crítica autocontenida (sin Google Fonts bloqueante) -->
    <link
      rel="preload"
      href="/fonts/roboto-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- LCP: la imagen del hero se descubre en el HTML, no después del JS -->
    <link
      rel="preload"
      as="image"
      href="/hero-lab.webp"
      imagesrcset="/hero-lab-1280.webp 1280w, /hero-lab.webp 1920w"
      imagesizes="(max-width: 1280px) 100vw, 1280px"
      fetchpriority="high"
    />

    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        color: #1a1a1a;
        font-family: Roboto, "Roboto Fallback", Arial, sans-serif;
      }
      #root {
        min-height: 0;
      }
      .boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .boot-header {
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid #e5e5e5;
        background: #fff;
      }
      .boot-top {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        gap: 16px;
      }
      .boot-nav {
        border-top: 1px solid #e5e5e5;
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 12px 16px;
      }
      .boot-hero {
        min-height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        background: linear-gradient(180deg, #fff 0%, #f5f5f5 100%);
      }
      .boot-center {
        width: 100%;
        max-width: 48rem;
        text-align: center;
      }
      .boot-pulse {
        background: #ececec;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      .boot-logo {
        width: 160px;
        height: 40px;
        border-radius: 6px;
      }
      .boot-search {
        display: none;
        height: 44px;
        flex: 1;
        max-width: 32rem;
        border-radius: 999px;
      }
      .boot-icon {
        width: 44px;
        height: 44px;
        border-radius: 8px;
      }
      .boot-chip {
        width: 96px;
        height: 36px;
        border-radius: 999px;
      }
      .boot-title {
        height: 48px;
        max-width: 36rem;
        margin: 0 auto 16px;
        border-radius: 8px;
      }
      .boot-sub {
        height: 20px;
        max-width: 18rem;
        margin: 0 auto 28px;
        border-radius: 6px;
      }
      .boot-bar {
        height: 48px;
        max-width: 40rem;
        margin: 0 auto 20px;
        border-radius: 999px;
      }
      .boot-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .boot-btn {
        height: 48px;
        width: 176px;
        border-radius: 16px;
      }
      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (min-width: 1024px) {
        .boot-search {
          display: block;
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
    </style>

    <!--
      PRE-LAUNCH
      Cambiar a: content="index, follow"
      Antes del GO LIVE.
    -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="LaQQ | La Química Quirúrgica - Equipo de Laboratorio"
    />
    <meta
      property="og:description"
      content="Proveedor especializado en equipo de laboratorio, material de consumo y servicios técnicos para la industria científica."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://laqq.com.ar/" />
    <meta
      property="og:image"
      content="https://laqq.com.ar/laqq_marca_color_neg.png"
    />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="La Química Quirúrgica" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@laqq_lab" />
    <meta
      name="twitter:title"
      content="LaQQ | La  Química Quirúrgica - Equipo de Laboratorio"
    />
    <meta
      name="twitter:description"
      content="Proveedor especializado en equipo de laboratorio, material de consumo y servicios técnicos para la industria científica."
    />
    <meta
      name="twitter:image"
      content="https://laqq.com.ar/laqq_marca_color_neg.png"
    />

    <!-- Schema.org Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://laqq.com.ar/#organization",
            "name": "La Química Quirúrgica",
            "url": "https://laqq.com.ar/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://laqq.com.ar/logo-laqq.png"
            },
            "sameAs": ["https://twitter.com/laqq_lab"]
          },
          {
            "@type": "WebSite",
            "@id": "https://laqq.com.ar/#website",
            "url": "https://laqq.com.ar/",
            "name": "La Química Quirúrgica",
            "publisher": {
              "@id": "https://laqq.com.ar/#organization"
            },
            "inLanguage": "es-AR"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <div
      id="boot-shell"
      class="boot-shell"
      role="status"
      aria-live="polite"
      aria-label="Cargando La Química Quirúrgica"
    >
        <header class="boot-header">
          <div class="boot-top">
            <div class="boot-pulse boot-logo"></div>
            <div class="boot-pulse boot-search"></div>
            <div style="display: flex; gap: 8px">
              <div class="boot-pulse boot-icon"></div>
              <div class="boot-pulse boot-icon"></div>
            </div>
          </div>
          <nav class="boot-nav" aria-hidden="true">
            <div class="boot-pulse boot-chip"></div>
            <div class="boot-pulse boot-chip"></div>
            <div class="boot-pulse boot-chip"></div>
            <div class="boot-pulse boot-chip"></div>
            <div class="boot-pulse boot-chip"></div>
            <div class="boot-pulse boot-chip"></div>
          </nav>
        </header>
        <main class="boot-hero">
          <div class="boot-center">
            <div class="boot-pulse boot-title"></div>
            <div class="boot-pulse boot-title"></div>
            <div class="boot-pulse boot-sub"></div>
            <div class="boot-pulse boot-bar"></div>
            <div class="boot-actions">
              <div class="boot-pulse boot-btn"></div>
              <div class="boot-pulse boot-btn"></div>
            </div>
          </div>
        </main>
        <span class="boot-sr">Cargando contenido…</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
