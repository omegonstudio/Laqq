<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1f2a" />

    <title>La Química Quirúrgica - Equipo y Material de Laboratorio</title>
    <meta
      name="description"
      content="Proveedor especializado en equipo de laboratorio, material de consumo y servicios técnicos para la industria científica."
    />
    <meta name="author" content="La Química Quirúrgica" />

    <!-- Canonical (HTTPS listo para producción) -->
    <link rel="canonical" href="https://laqq.com.ar/" />

    <!-- Performance: fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- LCP: la imagen del hero se descubre en el HTML, no después del JS -->
    <link
      rel="preload"
      as="image"
      href="/hero-lab.webp"
      imagesrcset="/hero-lab-1280.webp 1280w, /hero-lab.webp 1920w"
      imagesizes="(max-width: 1280px) 100vw, 1280px"
      fetchpriority="high"
    />

    <!--
      PRE-LAUNCH
      Cambiar a: content="index, follow"
      Antes del GO LIVE.
    -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="La Química Quirúrgica - Equipo de Laboratorio"
    />
    <meta
      property="og:description"
      content="Proveedor especializado en equipo de laboratorio, material de consumo y servicios técnicos para la industria científica."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://laqq.com.ar/" />
    <meta
      property="og:image"
      content="https://laqq.com.ar/laqq_marca_color_neg.png"
    />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="La Química Quirúrgica" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@laqq_lab" />
    <meta
      name="twitter:title"
      content="La Química Quirúrgica - Equipo de Laboratorio"
    />
    <meta
      name="twitter:description"
      content="Proveedor especializado en equipo de laboratorio, material de consumo y servicios técnicos para la industria científica."
    />
    <meta
      name="twitter:image"
      content="https://laqq.com.ar/laqq_marca_color_neg.png"
    />

    <!-- Schema.org Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://laqq.com.ar/#organization",
            "name": "La Química Quirúrgica",
            "url": "https://laqq.com.ar/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://laqq.com.ar/logo-laqq.png"
            },
            "sameAs": ["https://twitter.com/laqq_lab"]
          },
          {
            "@type": "WebSite",
            "@id": "https://laqq.com.ar/#website",
            "url": "https://laqq.com.ar/",
            "name": "La Química Quirúrgica",
            "publisher": {
              "@id": "https://laqq.com.ar/#organization"
            },
            "inLanguage": "es-AR"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
