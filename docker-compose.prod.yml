services:
  db:
    image: postgres:15-alpine
    container_name: laqq-db
    environment:
      POSTGRES_DB: ${DB_NAME:-laqq_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-laqq_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laqq-prod

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.prod
    container_name: laqq-backend
    env_file: .env
    environment:
      DJANGO_ENV: production
      DEBUG: ${DEBUG:-False}
      DB_HOST: db
      DB_PORT: 5432
      LOAD_SEED_DATA: ${LOAD_SEED_DATA:-false}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/login/ || exit 1"]
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - laqq-prod

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.prod
      args:
        # Ruta relativa: funciona con HTTP actual y HTTPS en GO LIVE.
        VITE_API_BASE_URL: /api
        # PROD (.env): VITE_SITE_ORIGIN=https://laqq.com.ar (default)
        # DEV  (.env): VITE_SITE_ORIGIN=http://laqq.omegon.com.ar
        VITE_SITE_ORIGIN: ${VITE_SITE_ORIGIN:-https://laqq.com.ar}
        # PROD (.env): NGINX_CONFIG=nginx.conf (default)
        # DEV  (.env): NGINX_CONFIG=nginx.dev.conf
        NGINX_CONFIG: ${NGINX_CONFIG:-nginx.conf}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: laqq-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - backend_static:/var/www/static
      - backend_media:/var/www/media
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - laqq-prod

volumes:
  db_data:
  backend_static:
  backend_media:

networks:
  laqq-prod:
    driver: bridge

