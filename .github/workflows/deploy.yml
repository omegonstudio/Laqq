- name: Deploy on droplet
  env:
    DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
    DROPLET_USER: deploy
  run: |
    ssh "$DROPLET_USER@$DROPLET_HOST" <<'EOF'
    set -e

    cd /opt/apps/Laqq

    git fetch origin main
    git reset --hard origin/main

    docker compose -f docker-compose.prod.yml up -d --build
    EOF
