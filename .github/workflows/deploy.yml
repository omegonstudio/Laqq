name: Deploy LAQQ

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: laqq-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ========================
  # CI
  # ========================
  ci:
    name: CI (tests + frontend build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Backend: tests ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install backend deps
        working-directory: Backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: Backend
        run: python manage.py test tickets contacts attachments quotes

      # ---------- Frontend: build ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend deps
        working-directory: Frontend
        run: npm ci

      - name: Frontend build
        working-directory: Frontend
        run: npm run build

  # ========================
  # DEPLOY
  # ========================
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: ci

    environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}

    env:
      BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy en Droplet
        run: |
          ssh deploy@${{ secrets.DROPLET_HOST }} \
          "BRANCH=${BRANCH} bash -s" <<'REMOTE'
            set -euo pipefail

            echo "========================================"
            echo " DEPLOY LAQQ"
            echo " Branch: $BRANCH"
            echo "========================================"

            REPO="https://github.com/omegonstudio/Laqq.git"
            DIR="/opt/apps/Laqq"
            COMPOSE="docker-compose.prod.yml"

            mkdir -p "$DIR"
            cd "$DIR"

            if [ ! -d ".git" ]; then
              echo "-> Clonando repositorio"
              git clone "$REPO" .
            fi

            echo "-> Commit previo"
            git rev-parse --short HEAD > .last_deploy_commit || true

            echo "-> Fetch"
            git fetch origin

            echo "-> Checkout $BRANCH"
            git reset --hard origin/$BRANCH

            echo "-> Validando compose"
            docker compose -f "$COMPOSE" config -q

            echo "-> Levantando DB"
            docker compose -f "$COMPOSE" up -d db

            echo "-> Esperando DB"

            for i in {1..30}; do
              if docker inspect -f '{{.State.Health.Status}}' laqq-db 2>/dev/null | grep -q healthy; then
                echo "DB healthy"
                break
              fi

              sleep 2

              if [ "$i" -eq 30 ]; then
                docker compose -f "$COMPOSE" logs db --tail=200
                exit 1
              fi
            done

            echo "-> Build"

            docker compose -f "$COMPOSE" build backend frontend

            echo "-> Backend"

            docker compose -f "$COMPOSE" up -d backend

            for i in {1..60}; do

              STATUS=$(docker inspect -f '{{.State.Health.Status}}' laqq-backend 2>/dev/null || echo unknown)

              if [ "$STATUS" = healthy ]; then
                echo "Backend healthy"
                break
              fi

              if [ "$STATUS" = unhealthy ]; then
                docker compose -f "$COMPOSE" logs backend --tail=100
                exit 1
              fi

              sleep 5

              if [ "$i" -eq 60 ]; then
                docker compose -f "$COMPOSE" logs backend --tail=100
                exit 1
              fi

            done

            echo "-> Frontend"

            docker compose -f "$COMPOSE" up -d frontend

            echo "-> Estado"

            docker compose -f "$COMPOSE" ps

            echo "========================================"
            echo " DEPLOY OK"
            echo "========================================"

          REMOTE