name: Deploy LAQQ (PROD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: laqq-prod
  cancel-in-progress: true

# ======================================================
# CI
# ======================================================
jobs:
  ci:
    name: CI (frontend build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Frontend build ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend deps
        working-directory: Frontend
        run: npm ci

      - name: Frontend build
        working-directory: Frontend
        run: npm run build

# ======================================================
# DEPLOY
# ======================================================
  deploy:
    name: Deploy (prod)
    needs: [ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy en Droplet
        run: |
          ssh deploy@${{ secrets.DROPLET_HOST }} "bash -s" <<'REMOTE'
            set -euo pipefail

            echo "========================================"
            echo "   DEPLOY LAQQ PROD"
            echo "========================================"

            REPO="https://github.com/omegonstudio/Laqq.git"
            DIR="/opt/apps/Laqq"
            BRANCH="main"
            COMPOSE="docker-compose.prod.yml"

            mkdir -p "$DIR"
            cd "$DIR"

            if [ ! -d ".git" ]; then
              echo "-> Clonando repositorio"
              git clone "$REPO" .
            fi

            echo "-> Guardando commit previo"
            git rev-parse --short HEAD > .last_deploy_commit || true

            echo "-> Fetch + reset"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            echo "-> Validando docker-compose"
            docker compose -f "$COMPOSE" config -q

            # ----------------------------
            # DB (NO se baja nunca)
            # ----------------------------
            echo "-> Asegurando DB arriba"
            docker compose -f "$COMPOSE" up -d db

            echo "-> Esperando DB healthy"
            for i in {1..30}; do
              if docker inspect -f '{{.State.Health.Status}}' laqq-db 2>/dev/null | grep -q healthy; then
                echo "   DB healthy"
                break
              fi
              sleep 2
              if [ "$i" -eq 30 ]; then
                echo "   DB no llegó a healthy"
                docker compose -f "$COMPOSE" logs --tail=200 db || true
                exit 1
              fi
            done

            # ----------------------------
            # App: bajar sin tocar DB
            # ----------------------------
            echo "-> Bajando app (backend + frontend)"
            docker compose -f "$COMPOSE" stop backend frontend || true
            docker compose -f "$COMPOSE" rm -f backend frontend || true

            echo "-> Limpieza de builder cache"
            docker builder prune -f || true

            # ----------------------------
            # Build imágenes
            # ----------------------------
            echo "-> Build imágenes"
            docker compose -f "$COMPOSE" build

            # ----------------------------
            # Migraciones y static
            # (NO dependen de contenedores vivos)
            # ----------------------------
            echo "-> Migraciones"
            docker compose -f "$COMPOSE" run --rm backend python manage.py migrate --noinput

            echo "-> Collectstatic"
            docker compose -f "$COMPOSE" run --rm backend python manage.py collectstatic --noinput

            # ----------------------------
            # UP FINAL (ATÓMICO)
            # ----------------------------
            echo "-> Levantando stack completo"
            docker compose -f "$COMPOSE" up -d

            echo "-> Estado final"
            docker compose -f "$COMPOSE" ps

            echo "========================================"
            echo "   DEPLOY LAQQ COMPLETADO"
            echo "========================================"
          REMOTE
