name: Deploy LAQQ (PROD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: laqq-prod
  cancel-in-progress: true

jobs:
  # ========================
  # CI
  # ========================
  ci:
    name: CI (tests + frontend build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Backend: tests ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install backend deps
        working-directory: Backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: Backend
        run: python manage.py test tickets contacts

      # ---------- Frontend: build ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend deps
        working-directory: Frontend
        run: npm ci

      - name: Frontend build
        working-directory: Frontend
        run: npm run build

  # ========================
  # DEPLOY
  # ========================
  deploy:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy en Droplet
        run: |
          ssh deploy@${{ secrets.DROPLET_HOST }} "bash -s" <<'REMOTE'
            set -euo pipefail

            echo "========================================"
            echo "   DEPLOY LAQQ PROD"
            echo "========================================"

            REPO="https://github.com/omegonstudio/Laqq.git"
            DIR="/opt/apps/Laqq"
            BRANCH="main"
            COMPOSE="docker-compose.prod.yml"

            mkdir -p "$DIR"
            cd "$DIR"

            if [ ! -d ".git" ]; then
              echo "-> Clonando repositorio"
              git clone "$REPO" .
            fi

            echo "-> Guardando commit previo"
            git rev-parse --short HEAD > .last_deploy_commit || true

            echo "-> Fetch + reset"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            echo "-> Validando docker-compose"
            docker compose -f "$COMPOSE" config -q

            echo "-> Levantando DB"
            docker compose -f "$COMPOSE" up -d db

            echo "-> Esperando DB healthy"
            for i in {1..30}; do
              if docker inspect -f '{{.State.Health.Status}}' laqq-db 2>/dev/null | grep -q healthy; then
                echo "   DB healthy"
                break
              fi
              sleep 2
              if [ "$i" -eq 30 ]; then
                echo "DB no llegó a healthy"
                docker compose -f "$COMPOSE" logs db --tail=200 || true
                exit 1
              fi
            done

            echo "-> Build backend + frontend"
            docker compose -f "$COMPOSE" build backend frontend

            echo "-> Levantando stack completo"
            docker compose -f "$COMPOSE" up -d

            echo "-> Esperando backend"
            for i in {1..20}; do
              if docker compose -f "$COMPOSE" ps backend | grep -q "Up"; then
                echo "   Backend arriba"
                break
              fi
              sleep 2
              if [ "$i" -eq 20 ]; then
                echo "Backend no levantó"
                docker compose -f "$COMPOSE" logs backend --tail=200 || true
                exit 1
              fi
            done

            echo "-> Migrations"
            docker compose -f "$COMPOSE" exec backend python manage.py migrate --noinput

            echo "-> Collectstatic"
            docker compose -f "$COMPOSE" exec backend python manage.py collectstatic --noinput

            echo "-> Estado final"
            docker compose -f "$COMPOSE" ps

            echo "========================================"
            echo "   DEPLOY LAQQ COMPLETADO OK"
            echo "========================================"
          REMOTE
