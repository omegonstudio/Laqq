name: Deploy LAQQ Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh deploy@${{ secrets.SSH_HOST }} "bash -s" <<'REMOTE'
          set -euo pipefail

          echo "========================================"
          echo "   DEPLOY LAQQ PROD"
          echo "========================================"

          APP_DIR="/opt/apps/Laqq"
          COMPOSE_FILE="docker-compose.prod.yml"

          cd "$APP_DIR"

          echo "-> Guardando commit previo"
          PREV_COMMIT=$(git rev-parse HEAD)

          echo "-> Fetch + reset hard"
          git fetch origin
          git reset --hard origin/main

          echo "-> Validando docker-compose"
          docker compose -f "$COMPOSE_FILE" config >/dev/null

          echo "-> Asegurando DB arriba"
          docker compose -f "$COMPOSE_FILE" up -d db

          echo "-> Esperando DB healthy"
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' laqq-db 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "   DB healthy"
              break
            fi
            sleep 2
          done

          if [ "$STATUS" != "healthy" ]; then
            echo "❌ DB no llegó a healthy"
            exit 1
          fi

          echo "-> Bajando app (frontend + backend)"
          docker compose -f "$COMPOSE_FILE" stop frontend backend
          docker compose -f "$COMPOSE_FILE" rm -f frontend backend

          echo "-> Limpieza de builder cache"
          docker builder prune -f

          echo "-> Build imágenes"
          docker compose -f "$COMPOSE_FILE" build --pull

          echo "-> Levantando servicios"
          docker compose -f "$COMPOSE_FILE" up -d frontend backend

          echo "-> Estado final"
          docker compose -f "$COMPOSE_FILE" ps

          echo "✅ Deploy finalizado correctamente"
          REMOTE
