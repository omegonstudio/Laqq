name: Deploy to DigitalOcean

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laqq-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh "$DROPLET_USER@$DROPLET_HOST" << 'EOF'
          set -e

          cd "$DEPLOY_DIR"

          echo "[deploy] Pulling code"
          git fetch origin main
          git reset --hard origin/main

          echo "[deploy] Building & starting containers"
          docker compose -f docker-compose.prod.yml up -d --build

          echo "[deploy] Done"
          EOF

      - name: Logs on failure
        if: failure()
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh "$DROPLET_USER@$DROPLET_HOST" \
          "cd '$DEPLOY_DIR' && docker compose -f docker-compose.prod.yml logs --tail=200"
