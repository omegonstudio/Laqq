name: Deploy LAQQ
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: laqq-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ========================
  # CI
  # ========================
  ci:
    name: CI (tests + frontend build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install backend deps
        working-directory: Backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: Backend
        run: python manage.py test tickets contacts attachments quotes
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend deps
        working-directory: Frontend
        run: npm ci
      - name: Frontend build
        working-directory: Frontend
        run: npm run build

  # ========================
  # DEPLOY
  # ========================
  deploy:
    name: Deploy (${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }})
    runs-on: ubuntu-latest
    needs: ci
    env:
      IS_MAIN: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
      BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.IS_MAIN == 'true' && secrets.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY_DEV }}

      - name: Add droplet to known_hosts
        env:
          DROPLET_HOST: ${{ env.IS_MAIN == 'true' && secrets.DROPLET_HOST || secrets.DROPLET_HOST_DEV }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

      - name: Deploy en Droplet
        env:
          DROPLET_HOST: ${{ env.IS_MAIN == 'true' && secrets.DROPLET_HOST || secrets.DROPLET_HOST_DEV }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          # Pasar args con printf %q evita que un \n final en el secret DEPLOY_DIR
          # parta el comando remoto en `env ...` + `bash -s` sin variables.
          # $3 = IS_MAIN → valida .env DEV vs PROD sin cambiar el flujo si la config es correcta.
          ssh "deploy@$DROPLET_HOST" \
            "bash -s -- $(printf '%q' "$BRANCH") $(printf '%q' "$DEPLOY_DIR") $(printf '%q' "$IS_MAIN")" <<'REMOTE'
            set -euo pipefail
            BRANCH="$1"
            DIR="$2"
            IS_MAIN="$3"
            DIR="${DIR//$'\r'/}"
            DIR="${DIR%%$'\n'}"
            echo "========================================"
            echo " DEPLOY LAQQ"
            echo " Branch: $BRANCH"
            echo " Dir: $DIR"
            echo " Entorno: $([ "$IS_MAIN" = "true" ] && echo PROD || echo DEV)"
            echo "========================================"
            REPO="https://github.com/omegonstudio/Laqq.git"
            COMPOSE="docker-compose.prod.yml"
            mkdir -p "$DIR"
            cd "$DIR"
            if [ ! -d ".git" ]; then
              echo "-> Clonando repositorio"
              git clone "${REPO}" .
            fi
            echo "-> Commit previo"
            git rev-parse --short HEAD > .last_deploy_commit || true
            echo "-> Fetch"
            git fetch origin
            echo "-> Checkout $BRANCH"
            git reset --hard origin/$BRANCH

            # R3: fallar temprano si falta .env o la config de build del entorno es incorrecta.
            # No imprime secretos; solo claves no sensibles usadas en build/compose.
            echo "-> Validando .env del servidor"
            if [ ! -f .env ]; then
              echo "ERROR: falta archivo .env en $DIR"
              echo "       El workflow no lo crea. Debe existir en el droplet (DEV/PROD)."
              exit 1
            fi

            get_env_value() {
              local key="$1"
              local default="${2:-}"
              local line
              line="$(grep -E "^${key}=" .env 2>/dev/null | tail -n 1 || true)"
              if [ -n "$line" ]; then
                printf '%s' "${line#*=}" | tr -d '\r' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
              else
                printf '%s' "$default"
              fi
            }

            NGINX_CONFIG_EFF="$(get_env_value NGINX_CONFIG nginx.conf)"
            VITE_SITE_ORIGIN_EFF="$(get_env_value VITE_SITE_ORIGIN https://laqq.com.ar)"

            echo "-> Config efectiva de build (sin secretos)"
            echo "   NGINX_CONFIG=$NGINX_CONFIG_EFF"
            echo "   VITE_SITE_ORIGIN=$VITE_SITE_ORIGIN_EFF"

            if [ "$IS_MAIN" = "true" ]; then
              if [ "$NGINX_CONFIG_EFF" = "nginx.dev.conf" ]; then
                echo "ERROR: PROD no puede usar NGINX_CONFIG=nginx.dev.conf"
                echo "       Usá nginx.conf (o omití la variable; default=nginx.conf)."
                exit 1
              fi
            else
              if [ "$NGINX_CONFIG_EFF" != "nginx.dev.conf" ]; then
                echo "ERROR: DEV requiere NGINX_CONFIG=nginx.dev.conf"
                echo "       valor actual: '${NGINX_CONFIG_EFF}'"
                echo "       Sin eso el build usa nginx.conf (SSL PROD) y el frontend falla."
                exit 1
              fi
              case "$VITE_SITE_ORIGIN_EFF" in
                http://laqq.omegon.com.ar|http://laqq.omegon.com.ar/)
                  ;;
                *)
                  echo "WARN: en DEV se recomienda VITE_SITE_ORIGIN=http://laqq.omegon.com.ar"
                  echo "      valor actual: '${VITE_SITE_ORIGIN_EFF}' (el deploy continúa)"
                  ;;
              esac
            fi

            echo "-> Validando compose"
            docker compose -f "$COMPOSE" config -q
            echo "-> Levantando DB"
            docker compose -f "$COMPOSE" up -d db
            echo "-> Esperando DB"
            for i in {1..30}; do
              if docker inspect -f '{{.State.Health.Status}}' laqq-db 2>/dev/null | grep -q healthy; then
                echo "DB healthy"
                break
              fi

              sleep 2

              if [ "$i" -eq 30 ]; then
                docker compose -f "$COMPOSE" logs db --tail=200
                exit 1
              fi
            done
            echo "-> Build"
            docker compose -f "$COMPOSE" build backend frontend
            echo "-> Backend"
            docker compose -f "$COMPOSE" up -d backend
            for i in {1..60}; do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' laqq-backend 2>/dev/null || echo unknown)
              if [ "$STATUS" = healthy ]; then
                echo "Backend healthy"
                break
              fi
              if [ "$STATUS" = unhealthy ]; then
                docker compose -f "$COMPOSE" logs backend --tail=100
                exit 1
              fi
              sleep 5

              if [ "$i" -eq 60 ]; then
                docker compose -f "$COMPOSE" logs backend --tail=100
                exit 1
              fi

            done
            echo "-> Frontend"
            docker compose -f "$COMPOSE" up -d frontend
            echo "-> Estado"
            docker compose -f "$COMPOSE" ps
            echo "========================================"
            echo " DEPLOY OK"
            echo "========================================"
          REMOTE
