name: Deploy LAQQ (PROD)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: laqq-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy en Droplet
        run: |
          ssh deploy@${{ secrets.DROPLET_HOST }} "bash -s" <<'REMOTE'
            set -euo pipefail

            echo "=== DEPLOY LAQQ PROD ==="

            REPO="https://github.com/omegonstudio/Laqq.git"
            DIR="/opt/apps/Laqq"
            BRANCH="main"
            COMPOSE="docker-compose.prod.yml"

            mkdir -p "$DIR"
            cd "$DIR"

            if [ ! -d ".git" ]; then
              echo "-> Clonando repositorio"
              git clone "$REPO" .
            fi

            echo "-> Fetch + reset"
            git fetch origin
            git reset --hard "origin/$BRANCH"

            echo "-> Bajando stack previo"
            docker compose -f "$COMPOSE" down --remove-orphans || true

            echo "-> Build"
            docker compose -f "$COMPOSE" build

            echo "-> Up"
            docker compose -f "$COMPOSE" up -d --remove-orphans

            echo "-> Estado"
            docker compose -f "$COMPOSE" ps

            echo "=== DEPLOY COMPLETADO ==="
          REMOTE
